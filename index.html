<body>

<div id="wrap"><canvas id="c"></canvas><div id="msg"></div><div id="shop" style="position:absolute;left:10px;top:10px;display:none;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:250px;max-height:75%;overflow:auto;font-size:13px"></div><canvas id="mm" width="140" height="140" style="position:absolute;left:auto;top:auto;right:10px;bottom:10px;width:140px;height:140px;border-radius:8px;border:1px solid #0006"></canvas></div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let S=4; // pixels par mètre
let roads=[],segs=[],stops=[],bus,score,over,keys={},obs=[],houses=[],trees=[],ponds=[],skin,pax=0,tod=60,rain=0,wt=30,drops=[],cars=[],money=0,up=[0,0,0,0,0,0,0,0],fleet=0,combo=1,ct=0,sv=5,rs=0,fl=[],own=[1,0,0,0,0,0,0,0],cur=0,mapOwn=[1,0,0,0],mapi=0,tab=0,mu=0,mt=0,ni=0,river=[],bridges=[],wk=[],lights=[],stt={stops:0,pax:0,earn:0,combo:1},og=[0,0,0,0,0],stars=0,pc=0,oc=0,door=0,ld=0,snd=1,streak=0,off=0,bonus=0;

// Génération procédurale : grille 7x7 déformée, routes courbes, toujours connectée
const SK=[['#e53935','#fff'],['#fbc02d','#212121'],['#1e88e5','#fff'],['#43a047','#fff'],['#8e24aa','#f5f5f5'],['#fb8c00','#263238'],['#eceff1','#d81b60'],['#00897b','#ffeb3b']];
function newSkin(){const c=SK[Math.random()*SK.length|0],r=Math.random();return{c1:c[0],c2:c[1],len:r<.2?9:r<.4?17:12,artic:r>=.2&&r<.4}}
function drawBus(k){
  const L=k.len,h=2.7;
  cx.fillStyle=k.c1;
  if(k.artic){cx.fillRect(-L/2,-h,L*.47,2*h);cx.fillRect(L*.03,-h,L*.47,2*h)}else cx.fillRect(-L/2,-h,L,2*h);
  cx.fillStyle=k.c2;cx.fillRect(-L/2+1,-h+.5,L-2,1);cx.fillRect(-L/2+1,h-1.5,L-2,1);
  if(k.artic){cx.fillStyle='#222';cx.fillRect(-L*.03,-1.3,L*.06,2.6)}
  cx.fillStyle='#90caf9';cx.fillRect(L/2-1.8,-h+.4,1.4,2*h-.8);
  cx.fillStyle='#fff3b0';cx.fillRect(L/2-.4,-h+.2,.5,.9);cx.fillRect(L/2-.4,h-1.1,.5,.9);
}
function roadD(x,y){let m=1e9;for(const s of segs){const d=distSeg(x,y,s);if(d<m)m=d}return m}
function placeObjects(){
  obs=[];trees=[];houses=[];ponds=[];river=[];
  if(MP().r){const ph=Math.random()*6,ox0=(Math.random()-.5)*200;for(let y=-640;y<=640;y+=16){const x=Math.sin(y/190+ph)*150+ox0;river.push([x,y])}}
  bridges=segs.filter(s=>rvD((s[0]+s[2])/2,(s[1]+s[3])/2)<15);
  const R=()=>(Math.random()-.5)*1100;
  for(let i=0;i<4;i++){const x=R(),y=R(),r=22+Math.random()*20;if(roadD(x,y)>r+10){ponds.push({x,y,r});obs.push({x,y,r:r*.9})}}
  segs.filter((s,i)=>i%MP().h===0).forEach(s=>{
    const dx=s[2]-s[0],dy=s[3]-s[1],l=Math.hypot(dx,dy)||1,side=Math.random()<.5?-1:1,d=s[4]/2+11;
    const x=(s[0]+s[2])/2-dy/l*d*side,y=(s[1]+s[3])/2+dx/l*d*side;
    if(roadD(x,y)>8&&rvD(x,y)>18&&!obs.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+10)){houses.push({x,y,a:Math.atan2(dy,dx),c:['#d7a97c','#e8d9b5','#c98f8f','#a9c4d6','#cfc5e0'][Math.random()*5|0]});obs.push({x,y,r:7})}
  });
  for(let i=0;i<MP().t;i++){const x=R(),y=R(),r=2+Math.random()*2.5;
    if(roadD(x,y)>r+3&&rvD(x,y)>16&&!obs.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+r+1)){trees.push({x,y,r,c:Math.random()<.5?MP().c[0]:MP().c[1]});obs.push({x,y,r:r*.6})}}
}
function newMap(){build(genMap());placeObjects();placeStops();placeCars();wk=[];door=0;skin=mkSkin()}
function honk(){try{const a=AC();if(!snd)return;a.resume();const t=a.currentTime,g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.03);g.gain.setValueAtTime(.09,t+.32);g.gain.linearRampToValueAtTime(0,t+.4);[392,494].forEach(fr=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.connect(f);o.start(t);o.stop(t+.45)});f.connect(g);g.connect(a.destination)}catch(e){}}
function placeCars(){
  cars=[];const col=['#ef5350','#42a5f5','#66bb6a','#ffee58','#ab47bc','#ffffff','#78909c'];
  for(let i=0;i<14;i++){const r=roads[Math.random()*roads.length|0];cars.push({r,i:Math.random()*(r.p.length-1)|0,t:Math.random(),d:Math.random()<.5?1:-1,v:5+Math.random()*5,c:col[Math.random()*7|0],x:0,y:0,a:0})}
  cars.forEach(c=>moveCar(0,c));for(let i=0;i<fleet;i++)addFleet();
}
function moveCar(dt,c){
  const p=c.r.p;let rem=c.v*dt;
  for(let g=0;g<6&&rem>0;g++){
    const A=p[c.i],B=p[c.i+1],l=Math.hypot(B[0]-A[0],B[1]-A[1])||1,left=c.d>0?(1-c.t)*l:c.t*l;
    if(rem<left){c.t+=c.d*rem/l;rem=0}else{rem-=left;const n=c.i+c.d;
      if(n<0||n>p.length-2){c.d=-c.d;c.t=c.d>0?0:1}else{c.i=n;c.t=c.d>0?0:1}}
  }
  const A=p[c.i],B=p[c.i+1],a=Math.atan2(B[1]-A[1],B[0]-A[0])+(c.d<0?Math.PI:0),o=c.r.w/4;
  c.x=A[0]+(B[0]-A[0])*c.t-Math.sin(a)*o;c.y=A[1]+(B[1]-A[1])*c.t+Math.cos(a)*o;c.a=a;
}
function weather(W,H){
  const a=Math.max(0,Math.min(.65,(.5-Math.sin(tod*.026))*1.1+rain*.12));
  if(a>.01){cx.fillStyle='rgba(8,14,50,'+a+')';cx.fillRect(0,0,W,H)}
  if(a>.12){const L=skin.len*S/2;cx.save();cx.translate(W/2,H/2);cx.rotate(bus.a);
    const g=cx.createLinearGradient(L,0,L+45*S,0);g.addColorStop(0,'rgba(255,235,160,'+Math.min(.5,a)+')');g.addColorStop(1,'rgba(255,235,160,0)');
    cx.fillStyle=g;cx.globalCompositeOperation='lighter';cx.beginPath();cx.moveTo(L,-6);cx.lineTo(L+45*S,-26*S);cx.lineTo(L+45*S,26*S);cx.lineTo(L,6);cx.fill();cx.restore()}
  if(a>.12)cars.forEach(c=>{
    const sx=W/2+(c.x-bus.x)*S,sy=H/2+(c.y-bus.y)*S;if(sx<-200||sx>W+200||sy<-200||sy>H+200)return;
    const L=(c.fb?c.fb.len:4.6)*S/2,D=(c.fb?32:22)*S,al=Math.min(.45,a*.8);
    cx.save();cx.translate(sx,sy-1.2*S);cx.rotate(c.a);cx.globalCompositeOperation='lighter';
    const g=cx.createLinearGradient(L,0,L+D,0);g.addColorStop(0,'rgba(255,240,180,'+al+')');g.addColorStop(1,'rgba(255,240,180,0)');
    cx.fillStyle=g;cx.beginPath();cx.moveTo(L,-3);cx.lineTo(L+D,-7*S);cx.lineTo(L+D,7*S);cx.lineTo(L,3);cx.fill();
    cx.fillStyle='rgba(255,50,40,'+Math.min(.9,a*1.4)+')';cx.fillRect(-L-1,-1.4*S,3,S);cx.fillRect(-L-1,.4*S,3,S);
    cx.restore()});
  if(rain){
    if(!drops.length)for(let i=0;i<180;i++)drops.push({x:Math.random()*W,y:Math.random()*H,v:14+Math.random()*8});
    cx.strokeStyle='rgba(200,220,255,.5)';cx.lineWidth=1;cx.beginPath();
    for(const d of drops){d.y+=d.v;d.x-=2;if(d.y>H||d.x<0){d.y=-10;d.x=Math.random()*W}cx.moveTo(d.x,d.y);cx.lineTo(d.x+3,d.y-12)}
    cx.stroke();
  }
  for(let i=fl.length-1;i>=0;i--){const f=fl[i];f.l-=.016;if(f.l<=0){fl.splice(i,1);continue}cx.globalAlpha=Math.min(1,f.l*2);cx.fillStyle='#ffe082';cx.font='bold 16px sans-serif';cx.textAlign='center';cx.fillText(f.s,W/2+(f.x-bus.x)*S,H/2+(f.y-bus.y)*S-30-(1.4-f.l)*40)}
  cx.globalAlpha=1;
}
const UPN=['Moteur turbo','Tarif premium','Grand bus','Aimant à arrêts','Turbo combo','Gestion de flotte','Suspension','Publicité'],UPD=['+8 % vitesse max','+20 % par passager','+1 passager par arrêt','validation de plus loin','combo max +1, plus durable','+25 % revenu des bus autonomes','+10 % de maniabilité','+10 % de gains partout'];
const upCost=i=>Math.round([60,50,80,70,90,120,100,150][i]*Math.pow(1.45,up[i])),flCost=()=>Math.round(150*Math.pow(1.6,fleet)),fare=()=>5*(1+.2*up[1]);
function pop(x,y,s){fl.push({x,y,s,l:1.4})}
function save(){try{localStorage.setItem('bus2d',JSON.stringify({money,up,fleet,own,cur,mapOwn,mapi,streak,stars,stt,og,day:new Date().toDateString(),ts:Date.now()}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('bus2d'));if(d){money=d.money||0;(d.up||[]).forEach((v,i)=>up[i]=v);fleet=d.fleet||0;own=d.own||own;cur=d.cur||0;mapOwn=d.mapOwn||mapOwn;mapi=d.mapi||0;streak=d.streak||0;stars=d.stars||0;stt=d.stt||stt;og=d.og||og;
  const now=Date.now(),sec=Math.min(14400,(now-(d.ts||now))/1000),inc=fleet*1.5*(1+.2*up[1])*(1+.25*up[5])*(1+.1*up[7])*(1+.15*stars);
  if(sec>60&&inc>0)off=Math.round(inc*sec*.5);
  if(d.day!==new Date().toDateString()){streak=d.day===new Date(now-864e5).toDateString()?streak+1:1;bonus=100*Math.min(streak,10)}}}catch(e){}}
function renderShopOld(){
  $('shop').innerHTML='<b>Garage</b>'+up.map((l,i)=>'<button data-i="'+i+'" '+(money<upCost(i)?'disabled':'')+'>'+UPN[i]+' niv. '+l+'<br><small>'+UPD[i]+' · '+upCost(i)+' €</small></button>').join('')+'<button data-i="f" '+(money<flCost()?'disabled':'')+'>Bus autonome ×'+fleet+'<br><small>'+(1.5*(1+.2*up[1])).toFixed(1)+' €/s chacun · '+flCost()+' €</small></button>';
}
function shopClickOld(e){const b=e.target.closest('button');if(!b)return;const i=b.dataset.i;
  if(i==='f'){if(money>=flCost()){money-=flCost();fleet++;addFleet()}}else if(money>=upCost(i)){money-=upCost(i);up[i]++}
  save();renderShop()}
function toggleShop(){const s=$('shop');s.style.display=s.style.display==='flex'?'none':'flex';renderShop();$('gb').blur()}
function addFleet(){const r=roads[Math.random()*roads.length|0];const c={r,i:Math.random()*(r.p.length-1)|0,t:Math.random(),d:1,v:9,c:'#fff',fb:newSkin(),x:0,y:0,a:0};moveCar(0,c);cars.push(c)}
function rr(L,Wd,r){cx.beginPath();if(cx.roundRect)cx.roundRect(-L/2,-Wd/2,L,Wd,r);else cx.rect(-L/2,-Wd/2,L,Wd)}
function stack(x,y,a,L,Wd,h,n,c,r,lay,top){
  for(let i=0;i<=n;i++){cx.save();cx.translate(x,y-i*h/n);cx.rotate(a);
    rr(L,Wd,r);cx.fillStyle=c;cx.fill();
    cx.fillStyle=i<n?'rgba(0,0,0,'+.42*(1-i/n)+')':'rgba(255,255,255,.2)';cx.fill();
    lay&&lay(i);if(i===n&&top)top();cx.restore()}
}
function shR(x,y,a,L,Wd,h){
  cx.save();cx.translate(x,y);cx.rotate(a);rr(L+1.6,Wd+1.6,1.5);cx.fillStyle='rgba(0,0,0,.2)';cx.fill();cx.restore();
  cx.beginPath();for(let i=0;i<=6;i++){cx.save();cx.translate(x+h*.08*i,y+h*.05*i);cx.rotate(a);cx.rect(-L/2,-Wd/2,L,Wd);cx.restore()}
  cx.fillStyle='rgba(0,0,0,.2)';cx.fill();
}
function busI(x,y,a,k){
  const L=k.len,Wd=3.6,hh=k.h||3.3;
  return{y,sh:()=>shR(x,y,a,L,Wd,hh),f:()=>stack(x,y,a,L,Wd,hh,7,k.c1,1.2,i=>{
    if(i===1){cx.fillStyle='#111';[-.32,.3].forEach(f=>{cx.fillRect(L*f-1.1,-Wd/2-.35,2.2,.8);cx.fillRect(L*f-1.1,Wd/2-.45,2.2,.8)})}
    if(i>=3&&i<=5){cx.fillStyle='#1b2c3f';cx.fillRect(-L/2+1.8,-Wd/2,L-3.6,.6);cx.fillRect(-L/2+1.8,Wd/2-.6,L-3.6,.6)}
    if(i>=2&&i<=5){cx.fillStyle=k.open?'#ffe082':'rgba(0,0,0,.45)';const dw=k.open?2.2:.2;cx.fillRect(L*.25-dw/2,-Wd/2,dw,.7);cx.fillRect(L*.25-dw/2,Wd/2-.7,dw,.7)}
    if(k.artic){cx.fillStyle='#1a1a1a';cx.fillRect(-.8,-Wd/2,1.6,Wd)}
  },()=>{
    cx.fillStyle=k.c2;cx.fillRect(-L/2+1,-Wd/2+.35,L-2,.45);cx.fillRect(-L/2+1,Wd/2-.8,L-2,.45);
    cx.fillStyle='#cfd8dc';[-.28,.06].forEach(f=>cx.fillRect(L*f-1.2,-1,2.4,2));
    cx.fillStyle='#1c2b3a';cx.fillRect(L/2-1.7,-Wd/2+.3,1.4,Wd-.6);
    cx.fillStyle='#fff3b0';cx.fillRect(L/2-.35,-Wd/2+.2,.4,.8);cx.fillRect(L/2-.35,Wd/2-1,.4,.8);
    cx.fillStyle='#d32f2f';cx.fillRect(-L/2,-Wd/2+.2,.4,.8);cx.fillStyle=k.open?'#00e676':'#ff1744';cx.fillRect(L*.25-.5,-.5,1,1);cx.fillRect(-L/2,Wd/2-1,.4,.8);
    if(k.artic){cx.fillStyle='#1a1a1a';cx.fillRect(-.8,-Wd/2,1.6,Wd)}
  })}
}
function drawScene(vw,vh){
  const it=[],ok=o=>Math.abs(o.x-bus.x)<vw&&Math.abs(o.y-bus.y)<vh+15;
  houses.filter(ok).forEach(o=>it.push({y:o.y,sh:()=>shR(o.x,o.y,o.a,14,10,9),f:()=>stack(o.x,o.y,o.a,14,10,9,9,o.c,.8,i=>{if(i>1&&i<7){cx.fillStyle='rgba(30,50,80,.55)';[-4,0,4].forEach(w=>cx.fillRect(w-1,4.3,2,.7))}},()=>{cx.fillStyle='#b5523b';cx.fillRect(-7,-5,14,10);cx.fillStyle='#8e3b2a';cx.fillRect(-7,-.4,14,.8)})}));
  trees.filter(ok).forEach(o=>it.push({y:o.y,sh:()=>{cx.beginPath();for(let i=0;i<=4;i++){const t=i/4,px=o.x+(o.r*.9+1.5)*t,py=o.y+(o.r*.5+1)*t,rd=.8+(o.r*.9-.8)*t;cx.moveTo(px+rd,py);cx.arc(px,py,rd,0,7)}cx.fillStyle='rgba(0,0,0,.2)';cx.fill()},f:()=>{cx.fillStyle='#4e342e';cx.fillRect(o.x-.7,o.y-3,1.4,3);[[3,1,0],[4.6,.82,.12],[6,.6,.25]].forEach(([z,k,l])=>{cx.beginPath();cx.arc(o.x,o.y-z,o.r*k,0,7);cx.fillStyle=o.c;cx.fill();cx.fillStyle='rgba(255,255,255,'+l+')';cx.fill()})}}));
  cars.filter(ok).forEach(c=>it.push(c.fb?busI(c.x,c.y,c.a,c.fb):{y:c.y,sh:()=>shR(c.x,c.y,c.a,4.6,2.1,1.5),f:()=>stack(c.x,c.y,c.a,4.6,2.1,1.5,3,c.c,.9,null,()=>{cx.fillStyle='#263238';cx.fillRect(.3,-.85,1.1,1.7);cx.fillRect(-1.5,-.85,.7,1.7);cx.fillStyle='#fff3b0';cx.fillRect(2.1,-.9,.3,.5);cx.fillRect(2.1,.4,.3,.5)})}));
  stopItems(it,ok);
  it.push(busI(bus.x,bus.y,bus.a,skin));
  it.sort((a,b)=>a.y-b.y);it.forEach(o=>o.sh());it.forEach(o=>o.f());
}
function stackOld(x,y,a,L,Wd,h,n,c,top){
  for(let i=0;i<=n;i++){cx.save();cx.translate(x,y-i*h/n);cx.rotate(a);cx.fillStyle=c;cx.fillRect(-L/2,-Wd/2,L,Wd);
    if(i<n){cx.fillStyle='rgba(0,0,0,'+.4*(1-i/n)+')';cx.fillRect(-L/2,-Wd/2,L,Wd)}else{cx.fillStyle='rgba(255,255,255,.22)';cx.fillRect(-L/2,-Wd/2,L,Wd);top&&top()}
    cx.restore()}
}
function shROld(x,y,a,L,Wd,h){cx.save();cx.translate(x+h*.45,y+h*.3);cx.rotate(a);cx.fillStyle='rgba(0,0,0,.22)';cx.fillRect(-L/2,-Wd/2,L,Wd);cx.restore()}
function busIOld(x,y,a,k){return{y,sh:()=>shR(x,y,a,k.len,5.4,3.4),f:()=>stack(x,y,a,k.len,5.4,3.4,7,k.c1,()=>{cx.fillStyle=k.c2;cx.fillRect(-k.len/2+1,-.5,k.len-2,1);cx.fillStyle='#90caf9';cx.fillRect(k.len/2-1.8,-2.3,1.4,4.6);cx.fillStyle='#fff3b0';cx.fillRect(k.len/2-.4,-2.5,.5,.9);cx.fillRect(k.len/2-.4,1.6,.5,.9);if(k.artic){cx.fillStyle='#222';cx.fillRect(-.6,-2.7,1.2,5.4)}})}}

  if(t&&Math.hypot(t.x-bus.x,t.y-bus.y)<12+4*up[3]&&Math.abs(bus.v)<2+.5*up[3]&&door){t.done=true;score++;board(t);chime();const n=1+(Math.random()*5|0)+up[2]+BUS[cur].cap,g=n*fare()*combo*mult();pax+=n;money+=g;stt.stops++;stt.pax+=n;stt.earn+=g;combo=Math.min(5+up[4],+(combo+.25).toFixed(2));ct=25+3*up[4];if(score%25===0){money+=g*5;pop(t.x,t.y-8,'Coffre ! +'+Math.round(g*5)+' €')}pop(t.x,t.y,'+'+Math.round(g)+' €')}
  if(!stops.find(s=>!s.done))placeStops();
  
  $('dr').textContent=door?'ouvertes':(t&&Math.hypot(t.x-bus.x,t.y-bus.y)<16&&Math.abs(bus.v)<3?'fermées — appuie sur 1':'fermées');skin.open=door;if(door&&Math.abs(bus.v)>4)door=0;if(door!==ld){ld=door;doorSnd(door)}doorAlarm(dt);$('sc').textContent=score;$('px').textContent=pax;$('mo').textContent=Math.floor(money).toLocaleString('fr-FR');$('cb').textContent=combo;$('sp').textContent=Math.round(Math.abs(bus.v)*3.6);
}
function draw(){
  const W=cv.width=cv.clientWidth,H=cv.height=cv.clientHeight;
  if(!W||!H||!bus)return;
  cx.fillStyle=MP().g;cx.fillRect(0,0,W,H);
  cx.save();cx.translate(W/2,H/2);cx.scale(S,S);cx.translate(-bus.x,-bus.y);
  const vw=W/S/2+60,vh=H/S/2+60;
  const vis=segs.filter(s=>Math.min(s[0],s[2])<bus.x+vw&&Math.max(s[0],s[2])>bus.x-vw&&Math.min(s[1],s[3])<bus.y+vh&&Math.max(s[1],s[3])>bus.y-vh);
  ponds.forEach(p=>{cx.fillStyle='#5fa8d3';cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();cx.strokeStyle='#8ccbe8';cx.lineWidth=1.2;cx.stroke()});
  cx.lineCap='round';cx.lineJoin='round';if(river.length){cx.strokeStyle=MP().w;cx.lineWidth=26;strokePath(river);cx.strokeStyle='rgba(255,255,255,.18)';cx.lineWidth=14;strokePath(river)}
  [[1.4,'#4a4a4a'],[-1.2,'#6b6b6b']].forEach(([e,c])=>{cx.strokeStyle=c;roads.forEach(o=>{cx.lineWidth=o.w+e;strokePath(o.p)})});
  cx.strokeStyle='#e8e2b0';cx.lineWidth=.35;cx.setLineDash([3,4]);
  roads.forEach(o=>strokePath(o.p));
  cx.setLineDash([]);
  const sg=s=>{cx.beginPath();cx.moveTo(s[0],s[1]);cx.lineTo(s[2],s[3]);cx.stroke()};
  cx.strokeStyle='#d9d9d9';bridges.forEach(s=>{cx.lineWidth=s[4]+2;sg(s)});
  cx.strokeStyle='#6b6b6b';bridges.forEach(s=>{cx.lineWidth=s[4]-.4;sg(s)});
  cx.strokeStyle='#e8e2b0';cx.lineWidth=.35;cx.setLineDash([3,4]);bridges.forEach(sg);cx.setLineDash([]);
  const t=stops.find(s=>!s.done);
  stops.filter(()=>0).forEach(s=>{cx.beginPath();cx.arc(s.x,s.y,s.done?3:8,0,7);cx.fillStyle=s.done?'#2e7d32':(s===t?'rgba(255,214,0,.9)':'rgba(255,255,255,.7)');cx.fill();if(!s.done){cx.fillStyle='#000';cx.font='bold 7px sans-serif';cx.textAlign='center';cx.fillText('P',s.x,s.y+2.5)}});
  if(0){for(let i=0;i<4;i++){const a=i*1.7+1,px=t.x+Math.cos(a)*(10+i),py=t.y+Math.sin(a)*(10+i);cx.fillStyle=['#e91e63','#3f51b5','#ff9800','#009688'][i];cx.beginPath();cx.arc(px,py,1.1,0,7);cx.fill()}}


  drawStops(t);drawScene(vw,vh);

  cx.restore();
  weather(W,H);
  if(t&&!over){
    const a=Math.atan2(t.y-bus.y,t.x-bus.x),d=Math.round(Math.hypot(t.x-bus.x,t.y-bus.y));
    cx.save();cx.translate(W/2,52);cx.rotate(a);cx.fillStyle='#ffd600';cx.beginPath();cx.moveTo(18,0);cx.lineTo(-10,-11);cx.lineTo(-10,11);cx.fill();cx.restore();
    cx.fillStyle='#fff';cx.font='bold 13px sans-serif';cx.textAlign='center';cx.fillText(d+' m',W/2,88);
  }
}
